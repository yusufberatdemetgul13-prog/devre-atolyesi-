try{const s=JSON.parse(localStorage.getItem('lp'));if(s&&Array.isArray(s.parts)&&Array.isArray(s.wires))S=s}catch(e){}
document.querySelector('#df defs').innerHTML=BDEFS;theme();$('bt').textContent=TL[TM];pal();

// Yakınlaştır / uzaklaştır / sığdır düğmeleri (iki parmak çalışmazsa da kesin çalışır)
{const zoomTo=(z,mx,my)=>{z=Math.min(4,Math.max(.2,z));const wx=(mx-view.x)/view.z,wy=(my-view.y)/view.z;view.z=z;view.x=mx-wx*z;view.y=my-wy*z;draw()};
 const by=f=>{const r=sv.getBoundingClientRect();zoomTo(view.z*f,r.width/2,r.height/2)};
 $('zi').onclick=()=>by(1.25);$('zo').onclick=()=>by(.8);
 $('zf').onclick=()=>{const r=sv.getBoundingClientRect();if(!S.parts.length){view.x=0;view.y=0;view.z=1;draw();return}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;S.parts.forEach(p=>{const h=HB[p.type]?Math.max(...HB[p.type])/2+30:60;x0=Math.min(x0,p.x-h);y0=Math.min(y0,p.y-h);x1=Math.max(x1,p.x+h);y1=Math.max(y1,p.y+h)});
  const z=Math.min(2,Math.max(.2,Math.min(r.width/(x1-x0),r.height/(y1-y0))));view.z=z;view.x=r.width/2-(x0+x1)/2*z;view.y=r.height/2-(y0+y1)/2*z;draw()}}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
